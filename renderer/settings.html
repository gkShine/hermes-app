<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Hermes App Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      padding: 20px;
    }
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .radio-group {
      display: flex;
      gap: 20px;
    }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    label {
      font-weight: 500;
      color: #ccc;
      font-size: 14px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 15px;
      transition: border-color 0.3s;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #00d4ff;
    }
    select option {
      background: #1a1a2e;
      color: #fff;
    }
    .hint {
      color: #888;
      font-size: 12px;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status.valid {
      display: block;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }
    .status.invalid {
      display: block;
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff4444;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }
    button {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: #000;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 212, 255, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .error-msg {
      color: #ff4444;
      font-size: 13px;
      display: none;
    }
    .error-msg.show {
      display: block;
    }
    .success-msg {
      color: #00ff88;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
    .success-msg.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="form-group">
      <label for="language" data-i18n="language">Language / 语言</label>
      <select id="language">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <div class="form-group">
      <label for="hermesPath" data-i18n="pathLabel">hermes-webui Path</label>
      <input type="text" id="hermesPath" placeholder="/Users/username/Work/hermes-webui">
      <div id="pathStatus" class="status"></div>
      <div id="errorMsg" class="error-msg"></div>
    </div>

    <div class="form-group">
      <label data-i18n="proxyMode">GitHub Proxy Mode</label>
      <div class="radio-group">
        <div class="radio-item">
          <input type="radio" name="proxyMode" id="proxyMode-direct" value="direct">
          <label for="proxyMode-direct" data-i18n="proxyModeDirect">Direct</label>
        </div>
        <div class="radio-item">
          <input type="radio" name="proxyMode" id="proxyMode-reverse" value="reverse">
          <label for="proxyMode-reverse" data-i18n="proxyModeReverse">Reverse Proxy</label>
        </div>
        <div class="radio-item">
          <input type="radio" name="proxyMode" id="proxyMode-http" value="http">
          <label for="proxyMode-http" data-i18n="proxyModeHttp">HTTP Proxy</label>
        </div>
      </div>
      <div class="hint" data-i18n="proxyModeHint">Choose how to proxy GitHub requests</div>
    </div>

    <div class="form-group">
      <label for="githubProxy" data-i18n="proxyLabel">GitHub Proxy Address</label>
      <input type="text" id="githubProxy" placeholder="https://ghfast.top/ OR http://127.0.0.1:7890">
      <div class="hint" data-i18n="proxyHint">Reverse: https://ghfast.top/ | HTTP: http://host:port</div>
      <div id="successMsg" class="success-msg"></div>
    </div>

    <div class="btn-group">
      <button id="saveBtn" class="btn-primary" data-i18n="saveBtn">Save</button>
      <button id="closeBtn" class="btn-secondary" data-i18n="closeBtn">Close</button>
    </div>
  </div>

  <script>
    const i18n = {
      en: {
        language: 'Language',
        pathLabel: 'hermes-webui Path',
        pathPlaceholder: '/Users/username/Work/hermes-webui',
        pathValid: '✓ Path is valid',
        pathInvalid: '✗ Path invalid or start.sh not found',
        proxyMode: 'GitHub Proxy Mode',
        proxyModeDirect: 'Direct',
        proxyModeReverse: 'Reverse Proxy',
        proxyModeHttp: 'HTTP Proxy',
        proxyModeHint: 'Choose how to proxy GitHub requests',
        proxyLabel: 'Proxy Address',
        proxyHint: 'Reverse: prefix URL with proxy | HTTP: use http proxy for all requests',
        saveBtn: 'Save',
        closeBtn: 'Close',
        saveSuccess: 'Settings saved successfully',
        enterPath: 'Please enter hermes-webui path'
      },
      zh: {
        language: '语言',
        pathLabel: 'hermes-webui 路径',
        pathPlaceholder: '/Users/用户名/Work/hermes-webui',
        pathValid: '✓ 路径有效',
        pathInvalid: '✗ 路径无效或 start.sh 不存在',
        proxyMode: 'GitHub 代理模式',
        proxyModeDirect: '直接连接',
        proxyModeReverse: '反向代理',
        proxyModeHttp: 'HTTP 代理',
        proxyModeHint: '选择 GitHub 请求的代理方式',
        proxyLabel: '代理地址',
        proxyHint: '反向代理：URL前缀拼接 | HTTP 代理：所有请求走代理',
        saveBtn: '保存',
        closeBtn: '关闭',
        saveSuccess: '设置保存成功',
        enterPath: '请输入 hermes-webui 路径'
      }
    };

    let currentLang = 'en';
    let currentValid = false;

    const languageSelect = document.getElementById('language');
    const hermesPathInput = document.getElementById('hermesPath');
    const proxyModeInputs = document.querySelectorAll('input[name="proxyMode"]');
    const githubProxyInput = document.getElementById('githubProxy');
    const pathStatus = document.getElementById('pathStatus');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const saveBtn = document.getElementById('saveBtn');
    const closeBtn = document.getElementById('closeBtn');

    function setLang(lang) {
      currentLang = lang;
      languageSelect.value = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (i18n[lang][key]) {
          el.textContent = i18n[lang][key];
        }
      });
      hermesPathInput.placeholder = i18n[lang].pathPlaceholder;
      githubProxyInput.placeholder = i18n[lang].proxyHint.includes('Reverse') 
        ? 'https://ghfast.top/ OR http://127.0.0.1:7890' 
        : '';
      if (currentValid) {
        pathStatus.textContent = i18n[lang][currentValid ? 'pathValid' : 'pathInvalid'];
      }
    }

    languageSelect.addEventListener('change', (e) => {
      setLang(e.target.value);
    });

    function updateStatus(valid, message) {
      currentValid = valid;
      pathStatus.className = 'status ' + (valid ? 'valid' : 'invalid');
      pathStatus.textContent = message || i18n[currentLang][valid ? 'pathValid' : 'pathInvalid'];
    }

    async function loadSettings() {
      const config = await window.electronAPI.settings.get();
      if (config.hermesPath) {
        hermesPathInput.value = config.hermesPath;
        const result = await window.electronAPI.settings.checkPath(config.hermesPath);
        updateStatus(result.valid);
      }
      if (config.proxyMode) {
        document.querySelector(`input[value="${config.proxyMode}"]`).checked = true;
      } else {
        // default reverse
        document.querySelector('input[value="reverse"]').checked = true;
      }
      if (config.githubProxy !== null && config.githubProxy !== undefined) {
        githubProxyInput.value = config.githubProxy;
      }

      // Auto detect language
      const browserLang = navigator.language.toLowerCase();
      setLang(browserLang.startsWith('zh') ? 'zh' : 'en');
    }

    hermesPathInput.addEventListener('blur', async () => {
      const path = hermesPathInput.value.trim();
      if (!path) {
        updateStatus(false);
        return;
      }
      const result = await window.electronAPI.settings.checkPath(path);
      updateStatus(result.valid);
    });

    saveBtn.addEventListener('click', async () => {
      const path = hermesPathInput.value.trim();
      const proxyMode = document.querySelector('input[name="proxyMode"]:checked').value;
      const proxy = githubProxyInput.value.trim();
      
      if (!path) {
        errorMsg.textContent = i18n[currentLang].enterPath;
        errorMsg.classList.add('show');
        successMsg.classList.remove('show');
        return;
      }
      
      errorMsg.classList.remove('show');
      saveBtn.disabled = true;

      await window.electronAPI.settings.save({
        hermesPath: path,
        githubProxy: proxy,
        proxyMode: proxyMode
      });

      successMsg.textContent = i18n[currentLang].saveSuccess;
      successMsg.classList.add('show');
      saveBtn.disabled = false;
    });

    closeBtn.addEventListener('click', () => {
      window.close();
    });

    loadSettings();
  </script>
</body>
</html>
