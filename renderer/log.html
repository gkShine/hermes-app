<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Hermes App - Install Log</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #eee;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
      -webkit-user-select: none;
    }
    .top-bar button {
      padding: 6px 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
      cursor: pointer;
      font-size: 13px;
    }
    .top-bar button:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .log-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: rgba(0, 0, 0, 0.5);
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .log-content {
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #aaa;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .log-line {
      margin: 2px 0;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .log-line.error {
      color: #ff6666;
    }
    .log-line.info {
      color: #66ccff;
    }
    .log-line.success {
      color: #66ff99;
    }
    .log-line.warning {
      color: #ffcc66;
    }
    .empty-log {
      color: #666;
      text-align: center;
      padding: 40px;
      font-style: italic;
    }
    .btn-group {
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
      -webkit-user-select: none;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: #ccc;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    button.primary {
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      color: #000;
    }
    .progress-bar {
      display: none;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .progress-bar.show {
      display: block;
    }
    .progress-text {
      font-size: 12px;
      color: #66ccff;
      margin-bottom: 6px;
    }
    .progress-track {
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
      transition: width 0.2s ease;
    }
    .progress-fill.indeterminate {
      width: 40% !important;
      transition: none;
      animation: indeterminate 1.2s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { margin-left: -40%; }
      100% { margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button id="closeBtn">Close</button>
  </div>

  <div id="progressBar" class="progress-bar">
    <div id="progressText" class="progress-text"></div>
    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <div class="log-container">
    <div id="logContent" class="log-content"></div>
    <div id="emptyLog" class="empty-log">No log entries yet</div>
  </div>

  <div class="btn-group">
    <button id="clearBtn">Clear Log</button>
    <button id="copyBtn">Copy Log</button>
  </div>

  <script>
    const i18n = {
      en: {
        close: 'Close',
        empty: 'No log entries yet',
        clear: 'Clear Log',
        copy: 'Copy Log',
        downloading: 'Downloading',
        extracting: 'Extracting...',
        done: 'Update complete'
      },
      zh: {
        close: '关闭',
        empty: '暂无日志',
        clear: '清空日志',
        copy: '复制日志',
        downloading: '下载中',
        extracting: '解压中...',
        done: '更新完成'
      }
    };

    let currentLang = 'en';
    let logs = [];

    const logContent = document.getElementById('logContent');
    const emptyLog = document.getElementById('emptyLog');
    const closeBtn = document.getElementById('closeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');

    function setLang(lang) {
      currentLang = lang;
      closeBtn.textContent = i18n[lang].close;
      clearBtn.textContent = i18n[lang].clear;
      copyBtn.textContent = i18n[lang].copy;
      if (logs.length === 0) {
        emptyLog.textContent = i18n[lang].empty;
      }
      renderLog();
    }

    function addLogEntry(entry) {
      logs.push(entry);
      renderLog();
    }

    function renderLog() {
      if (logs.length === 0) {
        logContent.innerHTML = '';
        emptyLog.style.display = 'block';
        return;
      }
      emptyLog.style.display = 'none';
      logContent.innerHTML = '';
      logs.forEach(entry => {
        const line = document.createElement('div');
        line.className = 'log-line ' + entry.type;
        line.textContent = entry.message;
        logContent.appendChild(line);
      });
      logContent.scrollTop = logContent.scrollHeight;
    }

    closeBtn.addEventListener('click', () => {
      window.close();
    });

    clearBtn.addEventListener('click', async () => {
      logs = [];
      await window.electronAPI.log.clear();
      renderLog();
    });

    copyBtn.addEventListener('click', async () => {
      const text = logs.map(l => l.message).join('\n');
      await navigator.clipboard.writeText(text);
      alert(i18n[currentLang].copy + ' successfully');
    });

    // Load existing logs and language
    async function loadLogs() {
      logs = await window.electronAPI.log.getLogs();
      // Get language from settings (we'll detect browser language)
      const browserLang = navigator.language.toLowerCase();
      setLang(browserLang.startsWith('zh') ? 'zh' : 'en');
      renderLog();
    }

    // Listen for new logs
    window.electronAPI.log.onNewLog((event, entry) => {
      addLogEntry(entry);
      updateProgressFromLog(entry);
    });

    function updateProgressFromLog(entry) {
      const msg = (entry && entry.message) || '';
      if (msg.includes('extracting')) {
        progressBar.classList.add('show');
        progressFill.classList.add('indeterminate');
        progressText.textContent = i18n[currentLang].extracting;
      } else if (msg.includes('Update complete')) {
        progressBar.classList.add('show');
        progressFill.classList.remove('indeterminate');
        progressFill.style.width = '100%';
        progressText.textContent = i18n[currentLang].done;
      }
    }

    // Listen for download progress
    window.electronAPI.log.onInstallProgress((event, payload) => {
      progressBar.classList.add('show');
      if (payload.indeterminate) {
        progressFill.classList.add('indeterminate');
        const kb = Math.round((payload.receivedBytes || 0) / 1024);
        progressText.textContent = `${i18n[currentLang].downloading} ${kb}KB`;
      } else {
        progressFill.classList.remove('indeterminate');
        progressFill.style.width = payload.progress + '%';
        progressText.textContent = `${i18n[currentLang].downloading} ${payload.progress}%`;
      }
    });

    loadLogs();
  </script>
</body>
</html>
